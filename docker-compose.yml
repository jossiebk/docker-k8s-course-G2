services:

  postgres:
    image: postgres:17-alpine
    container_name: virtual-library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - k8sg2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
         
  mongodb:
    image: mongo:8
    container_name: virtual-library-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - k8sg2
    healthcheck:
      test: ["CMD", "mongosh","--username","${MONGO_USER}",  "--password", "${MONGO_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  users-api:
    build:
      context: ./UsersApi
    image: jossie/users-api:1.0
    container_name: users-api
    restart: unless-stopped
    ports:
      - "${USERS_API_PORT}:6001"
    environment:
      ASPNETCORE_URLS: http://+:6001
    networks:
      - k8sg2

  books-api:
    build:
      context: ./BooksApi
    image: jossie/books-api:1.0
    container_name: books-api
    restart: unless-stopped
    ports:
      - "${BOOKS_API_PORT}:6002"
    environment:
      PORT: 6002
    networks:
      - k8sg2
       
  events-api:
    build:
      context: ./EventsApi
    image: jossie/events-api:1.0
    container_name: events-api
    restart: unless-stopped
    ports:
      - "${EVENTS_API_PORT}:6003"
    networks:
      - k8sg2    


  reviews-api:
    build:
      context: ./ReviewsApi
    image: jossie/reviews-api:1.0
    container_name: reviews-api
    restart: unless-stopped
    ports:
      - "${REVIEWS_API_PORT}:6004"
    environment:
      PORT: 6004
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - k8sg2


  reservation-api:
    build:
      context: ./ReservationReturnApi
    image: jossie/reservation-api:1.0
    container_name: reservation-api
    restart: unless-stopped
    ports:
      - "${RESERVATION_API_PORT}:6005"
    environment:
      ASPNETCORE_URLS: http://+:6005
      POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - k8sg2

  orders-api:
    build:
      context: ./OrdersApi
    image: jossie/orders-api:1.0
    container_name: orders-api
    restart: unless-stopped
    ports:
      - "${ORDERS_API_PORT}:6006"
    environment:
      SERVER_PORT: 6006
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - k8sg2


  frontend:
    build:
      context: ./LibraryFrontend
    image: jossie/library-frontend:1.0
    container_name: library-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - users-api
      - books-api
      - events-api
      - reviews-api
      - reservation-api
      - orders-api
    networks:
      - k8sg2


networks:
  k8sg2:
    name: k8sg2
    driver: bridge

volumes:
  postgres_data:
    name: k8sg2_postgres_data

  mongo_data:
    name: k8sg2_mongo_data